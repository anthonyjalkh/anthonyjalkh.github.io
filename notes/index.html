<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anthony Jalkh | Astrophysics & Computation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/none.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />

  <style>
    :root {
      --accent-cyan: #6ECFF6;
      --accent-purple: #b48cff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0a0e1a url('https://static.vecteezy.com/system/resources/previews/000/834/435/non_2x/beautiful-space-background-vector.jpg')
        no-repeat center center fixed;
      background-size: cover;
      color: #ddd;
    }
    .content { background: rgba(5, 5, 15, 0.72); min-height: 100vh; }
    .sidebar {
      background: rgba(5, 5, 15, 0.9);
      border-right: 1px solid rgba(180,140,255,0.15);
      font-size: 15px;
    }
    .sidebar-nav a { color: #ccc; }
    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      color: var(--accent-purple);
      text-shadow: 0 0 8px rgba(180,140,255,0.6);
    }
    .app-name-link { color: #fff !important; }
    .markdown-section { max-width: 820px; color: #ddd; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #fff;
      text-shadow: 0 0 6px rgba(255,255,255,0.15);
    }
    .markdown-section h2 { border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 6px; }
    .markdown-section a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .markdown-section a:hover {
      color: #fff;
      text-shadow: 0 0 8px var(--accent-cyan);
    }
    .markdown-section code {
      background: rgba(255,255,255,0.08);
      color: var(--accent-cyan);
    }
    .markdown-section pre {
      background: rgba(0,0,0,0.5) !important;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .search input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(180,140,255,0.3);
      color: #fff;
    }
    .search .results-panel { background: #10101a; color: #ddd; }
    .app-name-link img { display: none; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>

  <script>
    window.$docsify = {
      name: "Anthony Jalkh | M2 Notes",
      repo: "https://github.com/anthonyjalkh/anthonyjalkh.github.io",
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: "Search notes...",
        noData: "No results found",
        depth: 3
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (markdown) {
            // Display math: $$...$$
            markdown = markdown.replace(/\$\$([\s\S]+?)\$\$/g, function (match, expr) {
              try {
                return katex.renderToString(expr.trim(), { displayMode: true, throwOnError: false });
              } catch (e) {
                return match;
              }
            });
            // Inline math: $...$
            markdown = markdown.replace(/\$([^\$\n]+?)\$/g, function (match, expr) {
              try {
                return katex.renderToString(expr.trim(), { displayMode: false, throwOnError: false });
              } catch (e) {
                return match;
              }
            });
            return markdown;
          });
        }
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-fortran.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
